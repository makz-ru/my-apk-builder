<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Clicker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            margin-top: 40px;
            text-align: center;
        }
        .score-title {
            font-size: 14px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score {
            font-size: 56px;
            font-weight: 900;
            color: #58a6ff;
            margin: 5px 0;
        }
        .debug-log {
            font-size: 14px;
            color: #7ee787;
            margin-top: 5px;
        }
        .click-area {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-grow: 1;
        }
        .main-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1f6feb, #114fb4);
            border: 4px solid #388bfd;
            box-shadow: 0 0 30px rgba(31, 111, 235, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 72px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-title">Кредиты</div>
        <div class="score" id="score">0</div>
        <div class="debug-log" id="debugLog">Тапай по экрану!</div>
    </div>

    <div class="click-area">
        <div class="main-btn">⚡</div>
    </div>

    <script>
        let score = 0;
        const scoreEl = document.getElementById('score');
        const debugLog = document.getElementById('debugLog');

        // Вешаем обработчик на весь документ, чтобы касание сработало в любой точке
        document.addEventListener('pointerdown', (e) => {
            score += 1;
            scoreEl.textContent = score;
            debugLog.textContent = "Клик зафиксирован! (" + score + ")";
        });
    </script>
</body>
</html>
